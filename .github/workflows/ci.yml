name: quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated API artifacts
        run: |
          pnpm api:coverage
          git diff --exit-code -- docs/api-coverage.md
          pnpm api:check
      - name: Check source quality
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm bundle:check
      - name: Install Chromium for accessibility audit
        run: pnpm exec playwright install --with-deps chromium
      - name: Audit accessibility and browser runtime
        run: pnpm test:e2e:a11y
      - name: Build and test the production container
        run: |
          docker build -t atom-crm-web:ci .
          docker run --detach --rm --name atom-crm-web-production-test \
            -p 127.0.0.1:18089:8080 \
            -e ATOM_CRM_API_UPSTREAM=http://127.0.0.1:18080 atom-crm-web:ci
          trap 'docker stop atom-crm-web-production-test >/dev/null' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors \
            --max-time 5 --retry-max-time 30 http://127.0.0.1:18089/login >/dev/null
          pnpm test:e2e:production
      - name: Preserve failed browser test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-reports
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
